name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -m "not exasol"
      - run: uv run pip-audit
        continue-on-error: true

  exasol:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev

      - name: Start Exasol Nano Container
        run: |
          mkdir -p "$RUNNER_TEMP/secrets"
          echo -n "TestSysPass123!" > "$RUNNER_TEMP/secrets/sys_password"
          docker run -d --name exasol-nano \
            --shm-size=512mb \
            --pids-limit=-1 \
            -p 127.0.0.1:8563:8563 \
            -v "$RUNNER_TEMP/secrets/sys_password:/run/secrets/sys_password:ro" \
            docker.io/exasol/nano:2026.2.0-nano.3-amd64 \
            init sys_password_file=/run/secrets/sys_password

      - name: Wait for Exasol Nano Ready
        run: |
          echo "Waiting for Exasol Nano to be ready..."
          timeout 300 bash -c 'until docker logs exasol-nano 2>&1 | grep -q "Database is now up and running!"; do sleep 3; done'
          echo "Exasol Nano is up and running!"

      - name: Validate SQL Pipeline and Run Exasol Integration Tests
        env:
          EXASOL_DSN: 127.0.0.1:8563
          EXASOL_SYS_PASSWORD_FILE: ${{ runner.temp }}/secrets/sys_password
          EXASOL_PASSWORD: TestSysPass123!
        run: |
          if [ ! -d "sql" ] || [ -z "$(ls -A sql/*.sql 2>/dev/null)" ]; then
            echo "::error::Track A SQL pipeline (sql/*.sql) is missing! Cannot initialize schemas or run Exasol integration tests."
            exit 1
          fi
          uv run talos init
          uv run pytest -m exasol
